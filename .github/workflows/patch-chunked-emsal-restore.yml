name: Patch chunked Emsal restore
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chunked restore patch
        run: python3 scripts/patch_chunked_emsal_restore.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Import Emsal backup in safe chunks"
          git push
