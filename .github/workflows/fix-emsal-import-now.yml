name: Fix Emsal import now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 scripts/fix_emsal_import_now.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js ui.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fix Emsal import batching and refresh UI"
          git push
