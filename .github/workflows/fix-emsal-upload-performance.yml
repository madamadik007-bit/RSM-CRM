name: Fix Emsal upload performance

on:
  push:
    branches: [main]
    paths-ignore:
      - worker.js
      - ui.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize Emsal file import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('worker.js')
          s=p.read_text(encoding='utf-8')
          old='for(let i=0;i<rows.length;i+=25){ const chunk=rows.slice(i,i+25);'
          new='for(let i=0;i<rows.length;i+=100){ const chunk=rows.slice(i,i+100);'
          if old in s:
              s=s.replace(old,new,1)
          else:
              old2='for(let i=0;i<rows.length;i+=25){const chunk=rows.slice(i,i+25);'
              new2='for(let i=0;i<rows.length;i+=100){const chunk=rows.slice(i,i+100);'
              if old2 in s: s=s.replace(old2,new2,1)
              else: raise SystemExit('Emsal import loop marker not found')
          p.write_text(s,encoding='utf-8')
          print('Emsal import batch size: 100')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git diff --cached --quiet || git commit -m 'Optimize Emsal file import batches'
          git push
