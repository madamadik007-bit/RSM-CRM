name: Apply Emsal import centre
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply import centre patch
        run: python3 scripts/patch-import-centre.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js worker.js package.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add Emsal JSON MHT Excel upload centre"
          git push
