name: Apply Emsal import centre
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Emsal display fix
        run: python3 scripts/fix-emsal-display.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js worker.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fix Emsal display fields and status filters"
          git push
